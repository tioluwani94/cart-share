<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAFA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>OurPantry · Aisle design review</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-review="aisle">
    <div class="phone review">
      <div class="review-chrome">
        <span class="compact-title" aria-hidden="true">Pantry</span>
        <button class="review-avatar" data-profile aria-label="Open settings">TK</button>
      </div>
      <div id="review-scroll">
        <header class="app-header">
          <div class="title-row"><h1>Pantry</h1></div>
          <p class="intro">Your household’s grocery rhythm</p>
        </header>
        <div class="review-controls">
          <div class="search-wrap">
            <span class="search-symbol" aria-hidden="true"></span>
            <label class="sr-only" for="search">Search your pantry</label>
            <input id="search" type="search" placeholder="Search your pantry" enterkeyhint="done" autocomplete="off" />
          </div>
          <div class="filters" id="filters" aria-label="Product status"></div>
        </div>
        <main id="stage" aria-label="Pantry prototype"></main>
      </div>
      <div class="app-tabs" aria-label="Existing app navigation, preview">
        <span data-tab="plan"></span>
        <button id="demo-shop-tab" data-tab="shop" aria-label="Open demo Shop tab"></button>
        <span class="selected" data-tab="pantry" aria-current="page"></span>
        <span data-tab="spending"></span>
      </div>
    </div>
    <dialog id="detail" aria-labelledby="detail-title"><div id="detail-body"></div></dialog>
    <div class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./harness.js"></script>
  </body>
</html>
